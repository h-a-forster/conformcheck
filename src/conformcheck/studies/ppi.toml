# Prediction-powered inference study (DESIGN section 15): exact coverage of ppi_py's mean
# intervals with a binary truth and a binary judge. Run with `python -m conformcheck.ppi`
# inside a venv holding ppi-python (scripts/ppi_study.py builds one); not a conformal study,
# so `conformcheck run` does not take it.

kind = "ppi"
name = "ppi"
n = [20, 50, 100, 200]
# judge accuracy: sensitivity = specificity = acc
acc = ["0.7", "0.8", "0.9", "0.95"]
# base rate pi = P(Y = 1), the estimand
pi = ["0.02", "0.1", "0.3", "0.5"]
alphas = ["0.1", "0.05"]
# unlabelled judge labels: a fixed array of this size with exactly N * mu ones
n_unlabelled = 10000
# outcomes are evaluated in order of probability until at most this mass is left
tail = "1e-10"
# outcomes per library call (one per column of a d-dimensional mean)
batch = 200
workers = 4
methods = ["ppi", "ppi++", "wald", "clopper_pearson"]

[mc]
seed = 20261121
draws = 20000
# [n, acc, pi, alpha], chosen before the run (DESIGN 15.4)
cells = [
    [20, "0.9", "0.02", "0.1"],
    [50, "0.9", "0.02", "0.1"],
    [50, "0.8", "0.1", "0.1"],
    [100, "0.7", "0.3", "0.1"],
    [200, "0.95", "0.02", "0.1"],
    [20, "0.95", "0.5", "0.1"],
]
